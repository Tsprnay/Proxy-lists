name: Update proxy files
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --user git-filter-repo

      - name: Run script and update only .txt files
        run: |
          python main.py

          git config --global user.name 'Tsprnay'
          git config --global user.email 'abobik3000@icloud.com'

          git add proxies/**/*.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update proxy txt files on $(date +'%Y-%m-%d %H:%M:%S')"
          fi

          git remote add Proxy-lists https://github.com/Tsprnay/Proxy-lists.git || true
          git push Proxy-lists master --force
